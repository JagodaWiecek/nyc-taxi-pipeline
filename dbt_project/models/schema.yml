version: 2

models:
  - name: fct_trips
    description: "One row per taxi trip from the silver layer, with friendly column names and derived fields."
    columns:
      - name: trip_id
        description: "Hash of all 19 source columns. The source has no trip identifier."
        tests:
          - unique
          - not_null
      - name: pickup_at
        description: "Date and time when the meter was engaged."
        tests:
          - not_null
      - name: dropoff_at
        description: "Date and time when the meter was disengaged."
        tests:
          - not_null
      - name: pickup_date
        description: "Calendar date of the pickup."
      - name: pickup_hour
        description: "Hour of the pickup (0-23)."
      - name: duration_seconds
        description: "Trip duration in seconds. Always positive (silver drops impossible durations)."
        tests:
          - not_null
      - name: has_negative_amount
        description: "True if fare_amount or total_amount is negative."
        tests:
          - not_null
      - name: has_zero_distance
        description: "True if trip_distance is 0."
        tests:
          - not_null
      - name: has_outlier_distance
        description: "True if trip_distance is above 100 miles (likely a recording error)."
        tests:
          - not_null
      - name: pickup_zone_id
        description: "TLC taxi zone where the trip started."
        tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id
      - name: dropoff_zone_id
        description: "TLC taxi zone where the trip ended."
        tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id
      - name: payment_type
        description: "How the passenger paid (code, see dim_payment_type)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_id
  - name: dim_zone
    description: "NYC taxi zones, one row per LocationID. Missing names are shown as 'Unknown'."
    columns:
      - name: location_id
        description: "TLC taxi zone ID, matches the pickup and dropoff zone IDs in fct_trips."
        tests:
          - unique
          - not_null
      - name: borough
        description: "Borough of the zone. 'Unknown' where the source has no value."
      - name: zone
        description: "Zone name. Not unique (e.g. Corona has IDs 56 and 57), so always join on location_id."
      - name: service_zone
        description: "TLC service zone, e.g. Yellow Zone, Boro Zone, Airports. 'Unknown' where the source has no value."
  - name: agg_demand_by_hour
    description: "Trips per pickup date and hour (one row per date and hour). Answers business question 1 (demand)."
    columns:
      - name: pickup_date
        description: "Calendar date of the pickup."
        tests:
          - not_null
      - name: pickup_hour
        description: "Hour of the pickup (0-23)."
        tests:
          - not_null
      - name: trips
        description: "Number of trips in that hour."
        tests:
          - not_null
      - name: avg_duration_seconds
        description: "Average trip duration in seconds."
      - name: total_duration_seconds
        description: "Sum of trip durations in seconds. Use it with trips to compute exact averages across groups of rows."
      - name: avg_duration_seconds
        description: "Average trip duration in seconds for this date and hour. Do not average it across rows without weighting by trips."
      - name: median_duration_seconds
        description: "Median trip duration in seconds for this date and hour. Cannot be combined across rows."
      - name: p90_duration_seconds
        description: "90th percentile of trip duration in seconds for this date and hour. Cannot be combined across rows."
      - name: min_duration_seconds
        description: "Shortest trip in this date and hour, in seconds."
      - name: max_duration_seconds
        description: "Longest trip in this date and hour, in seconds. Often an outlier."
  - name: agg_trips_by_zone
    description: "Trips, revenue and distance per taxi zone and role (pickup or dropoff). Revenue is the net total_amount, including negative adjustments, excluding cash tips."
    columns:
      - name: zone_role
        description: "Whether the zone is the trip's pickup or dropoff location. Each trip appears once per role, so never sum trips across both roles."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pickup', 'dropoff']
      - name: zone_id
        description: "TLC taxi zone ID, in dim_zone."
        tests:
          - not_null
      - name: borough
        description: "Borough of the zone."
      - name: zone
        description: "Zone name. Not unique, group by zone_id."
      - name: trips
        description: "Number of trips starting (pickup) or ending (dropoff) in the zone."
        tests:
          - not_null
      - name: total_revenue
        description: "Sum of total_amount. Net of negative adjustments, excludes cash tips."
      - name: total_distance_miles
        description: "Sum of trip_distance in miles."
  - name: agg_revenue_and_tips
    description: "Trips, fares, tips and revenue per payment type, pickup hour and distance bucket. Answers business question 3."
    columns:
      - name: payment_type
        description: "TLC payment type code (from dim_payment_type)."
        tests:
          - not_null
      - name: payment_type_name
        description: "Name of the payment type."
      - name: pickup_hour
        description: "Hour of the pickup (0-23)."
        tests:
          - not_null
      - name: distance_bucket
        description: "Trip distance range. The leading number gives the sort order."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0: zero', '1: 0-1 mi', '2: 1-2 mi', '3: 2-5 mi', '4: 5-10 mi', '5: 10-20 mi', '6: 20+ mi']
      - name: trips
        description: "Number of trips."
        tests:
          - not_null
      - name: total_fare
        description: "Sum of fare_amount (metered fare)."
      - name: total_tip
        description: "Sum of tip_amount. Cash tips are not recorded, so tips are meaningful mainly for card payments (payment_type 1)."
      - name: total_revenue
        description: "Sum of total_amount. Includes negative adjustments, excludes cash tips."
      - name: total_distance_miles
        description: "Sum of trip_distance in miles."
  - name: agg_efficiency_by_zone_hour
    description: "Trip counts and sums of distance, duration and fare per pickup zone and hour. Answers business question 4 (efficiency). Trips flagged has_zero_distance or has_negative_amount are excluded."
    columns:
      - name: zone_id
        description: "Pickup TLC taxi zone ID (see dim_zone)."
        tests:
          - not_null
      - name: borough
        description: "Borough of the pickup zone."
      - name: zone
        description: "Pickup zone name. Not unique, group by zone_id."
      - name: pickup_hour
        description: "Hour of the pickup (0-23)."
        tests:
          - not_null
      - name: trips
        description: "Number of trips without quality flags."
        tests:
          - not_null
      - name: total_distance_miles
        description: "Sum of trip_distance in miles."
      - name: total_duration_seconds
        description: "Sum of trip durations in seconds."
      - name: total_fare
        description: "Sum of fare_amount (metered fare, without tips, tolls and surcharges)."